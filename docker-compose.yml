# Local development stack. Production uses a normal PHP-FPM + Nginx/Apache host (see docs/04-DEPLOYMENT.md).
services:
  app:
    build: ./docker/php
    image: hvac-php:dev
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      # vendor lives in a Docker volume: much faster than a Windows/OneDrive bind mount.
      - vendor:/var/www/vendor
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    image: hvac-php:dev
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hvac
      MYSQL_USER: hvac
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret", "-uhvac"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vendor:
  mysql:
